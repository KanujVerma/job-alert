defaults:
  schedule_minutes: 15
  request_delay_seconds: [2, 4]
  user_agent_base: "job-alert-bot/0.1"
  state_path: state/seen_jobs.json
  timezone: America/Los_Angeles
  max_alerts_per_run: 25
  first_seen_ttl_days: 180
  # How long a company may return zero postings before the bot reports it as dead.
  # A patience window, not a schedule — the cron cadence is unchanged. Any single
  # empty fetch has boring explanations; requiring it to persist is what separates
  # "quiet" from "broken".
  adapter_stale_after_hours: 24

filters:
  # false since 2026-08-20: also alert on new-grad and early-career full-time
  # roles, not just confirmed internships. Measured before flipping, over the
  # whole ~9,000-posting corpus with freshness disabled: this lets through 3
  # additional postings, all genuinely early-career, none senior. The exclude,
  # tech-role, location and freshness layers are unchanged and still do the
  # filtering — only the final internship gate moved.
  internship_only: false
  freshness_hours: 48     # drop jobs posted more than 48h ago (skipped if posted_at unknown)
  early_career_keywords:
    - intern
    - internship
    - co-op
    - university
    - student
    - new grad
    - new graduate
    - early career
    - entry level
    - entry-level
    - graduate
    - campus
    - recent graduate
  technical_role_keywords:
    - software engineer
    - software engineering
    - swe
    - developer
    - backend
    - frontend
    - full stack
    - machine learning
    - ml
    - artificial intelligence
    - ai
    - data science
    - data scientist
    - data engineer
    - data engineering
    - applied scientist
    - research scientist
    - cloud engineer
    - platform engineer
    - infrastructure engineer
    - security engineer
    - systems engineer
    - hardware engineer
  title_tech_keywords:
    - software
    - data
    - analytics
    - business intelligence
    - bi
    - bi engineer
    - program manager
    - program management
    - product manager
    - product management
    - technical program manager
    - technical program management
    - technical product manager
    - tpm
    - tpm intern
    - pm intern
    - solutions architect
    - hardware
    - hardware engineering
    - cloud
    - platform
    - infrastructure
    - systems
    - security
    - operations
  exclude_keywords:
    - warehouse
    - fulfillment
    - retail
    - sales associate
    - sales
    - sales development
    - account executive
    - business development
    - customer support
    - call center
    - legal
    - finance
    - accounting
    - human resources
    - hr
    - facilities
    - maintenance
    - security guard
    - manufacturing operator
    - economics
    - economist
    - support specialist
    - recruiter
    - recruiting
    - talent acquisition
    - phd
    - ph.d
    - master's
    - masters
  exclude_unless_intern:
    - marketing
    - technician
    - hardware
    - manufacturing
    - operations
    - business analyst
    - solutions consultant
    - customer success
    - support engineer
  preferred_locations:
    - California
    - CA
    - Texas
    - TX
    - Chicago
    - Illinois
    - IL
    - New York
    - NY
    - Remote

companies:
  - name: Micron
    adapter: workday
    enabled: true
    config:
      base_url: https://micron.wd1.myworkdayjobs.com
      tenant: micron
      site: External

  - name: Salesforce
    adapter: workday
    enabled: true
    config:
      base_url: https://salesforce.wd12.myworkdayjobs.com
      tenant: salesforce
      site: External_Career_Site

  - name: CrowdStrike
    adapter: workday
    enabled: true
    config:
      base_url: https://crowdstrike.wd5.myworkdayjobs.com
      tenant: crowdstrike
      site: crowdstrikecareers

  - name: Intel
    adapter: workday
    enabled: true
    config:
      base_url: https://intel.wd1.myworkdayjobs.com
      tenant: intel
      site: External

  - name: Applied Materials
    adapter: workday
    enabled: true
    config:
      base_url: https://amat.wd1.myworkdayjobs.com
      tenant: amat
      site: External

  - name: Western Digital
    adapter: smartrecruiters
    enabled: true
    config:
      slug: WesternDigital

  - name: SanDisk
    adapter: smartrecruiters
    enabled: true
    config:
      slug: sandisk

  - name: Plaid
    adapter: lever
    enabled: true
    config:
      slug: plaid

  - name: Oracle
    adapter: oracle_careers
    enabled: true
    config:
      base_url: https://eeho.fa.us2.oraclecloud.com
      api_path: /hcmRestApi/resources/latest/recruitingCEJobRequisitions

  - name: Microsoft Research
    adapter: microsoft_research
    enabled: true
    config:
      base_url: https://www.microsoft.com/en-us/research/careers/open-positions/

  # The whole of Microsoft, via the Eightfold "PCSX" search API on
  # apply.careers.microsoft.com. Deliberately a SECOND Microsoft entry.
  #
  # CORRECTED 2026-08-20: an earlier version of this comment claimed the two
  # entries do not overlap. That was wrong. 75 of Microsoft Research's 99
  # listings have an apply URL of apply.careers.microsoft.com/careers/job/<id>
  # — the very ids this adapter enumerates — so the same posting reaches both.
  # Their job ids differ by construction (make_job_id namespaces by company and
  # platform, and seen_jobs is keyed per company), so nothing downstream can
  # collapse them; main.py dedupes on the apply URL within a run instead.
  # Both entries are still needed: MSR carries ~24 listings that are not on
  # PCSX, and PCSX carries the ~1140 US roles MSR has never had.
  #
  # robots.txt on that host is `Disallow: /` with an explicit `Allow: /api/pcsx`,
  # so this path is permitted. It is rate limited with no Retry-After header and
  # 429s after roughly 5 rapid requests, which is why the adapter spaces pages
  # by 3-5s.
  - name: Microsoft
    adapter: eightfold_pcsx
    enabled: true
    config:
      base_url: https://apply.careers.microsoft.com
      domain: microsoft.com
      location: United States
      # Results are sorted newest-first, so the adapter stops paging once a page
      # falls outside this window rather than walking all 114 pages. Keep it at
      # or above filters.freshness_hours (48) — below it, fresh postings go
      # unread. The adapter cannot see the filters section to check for itself.
      stop_after_hours: 48

  - name: Amazon
    adapter: amazon_jobs
    enabled: true
    config:
      include_internship_search: true
      base_categories:
        - Software Development
        - Data Science
        - Business Intelligence and Data Engineering
        - Applied Science
        - Research Science
        - "Project, Program, and Product Management — Technical"
        - "Systems, Quality, and Security Engineering"
        - Solutions Architecture
        - Hardware Development
      gated_categories:
        - category: "Project/Program/Product Management — Non-Tech"
          require_early_career: true

  - name: Apple
    adapter: apple_jobs
    enabled: true
    config:
      sources:
        - kind: internships
          team: internships-STDNT-INTRN
          require_early_career: false
        - kind: general
          require_early_career: true

  - name: Snowflake
    adapter: phenom_people
    # Disabled: searchJobs API requires authenticated browser session (session cookies).
    # Headless Playwright does not trigger Aurelia rendering; evaluate_fetch is CORS-blocked;
    # direct API calls return {"status":"failure"} without session cookies.
    # Re-enable when headed browser support is available.
    enabled: false
    config:
      tenant: SNCOUS
      base_url: https://careers.snowflake.com
      search_url: https://careers.snowflake.com/us/en/search
      api_base_url: https://content-us.phenompeople.com
      api_path: /api/{tenant}/searchJobs
      location_country: United States
      use_playwright: true
      browser_timeout_seconds: 30

  - name: Applied Digital
    adapter: generic_html
    enabled: false
    notes: "Disabled: careers page uses ADP Workforce Now JS-rendered portal. No static job cards or public JSON endpoint found. Could be supported later with a dedicated adp_workforce_now Playwright adapter."
    config:
      url: https://www.applieddigital.com/careers
