name: P2A source snapshot (temporary development only)
'on':
  push:
    branches: [feat/p2-a-public-job-boards]
    paths: [.github/workflows/p2a-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked public source only (no git credentials or environment)
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/jobbie-source.tar.gz" HEAD
      - name: Download missing pure-Python local test dependency
        run: python -m pip download --no-deps --dest "$RUNNER_TEMP/p2a-wheels" 'responses==0.25.8'
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/jobbie-source.tar.gz
            ${{ runner.temp }}/p2a-wheels/*.whl
          retention-days: 1
