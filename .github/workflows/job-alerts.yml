name: Job Alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop. Without this the job inherits GitHub's 6h default: on 2026-08-18 an
    # apt mirror stall inside `playwright install --with-deps` burned 360 billed
    # minutes in a single run before being killed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        timeout-minutes: 5
        run: pip install -r requirements.txt
      - name: Check whether any enabled company needs a browser
        # Only phenom_people and eightfold_playwright touch the browser, and both
        # belong to companies that are currently disabled — so the three Chromium
        # steps below did nothing on all 96 runs a day. Skipping them also removes
        # the failure mode that broke CI on 2026-08-18, rather than hardening it.
        # Driven by the config, not hardcoded: enabling Snowflake turns them back on.
        id: browser
        timeout-minutes: 2
        run: |
          # Fail safe. If the probe itself breaks, install the browser anyway —
          # an unnecessary install costs 20s, a missing one silently guts a scrape.
          needed="$(python main.py needs-browser 2>/dev/null || echo true)"
          case "$needed" in
            true|false) ;;
            *) needed=true ;;
          esac
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "browser needed: $needed"
      - name: Cache Playwright browsers
        if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Chromium
        if: steps.browser.outputs.needed == 'true'
        # Browser binary only. `--with-deps` was removed on 2026-08-19: it shells
        # out to `sudo apt-get`, and when the 180s timeout fired mid-download the
        # killed python left an orphaned apt-get holding /var/lib/dpkg/lock-frontend,
        # so retries 2 and 3 failed instantly on the lock and could never have
        # succeeded. apt also has no cache here, so it ran on every 15-minute job.
        # The runner image ships Google Chrome, so the shared libraries headless
        # Chromium needs are already present; the only packages apt ever added were
        # CJK/Thai/Cyrillic glyph fonts, and this bot reads DOM text rather than
        # rendering it. The smoke check below is what proves that assumption per-run.
        timeout-minutes: 7
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30 120 python -m playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt failed; retrying"
            sleep 10
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      - name: Verify Chromium launches
        if: steps.browser.outputs.needed == 'true'
        # Turns "the runner image already has the deps" from an assumption into a
        # checked fact. If a future image drops a shared library this fails here
        # with the loader error, instead of surfacing as a confusing scrape failure.
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<h1>ok</h1>")
              assert page.inner_text("h1") == "ok"
              browser.close()
          print("chromium launched and rendered DOM text")
          PY
      - name: Run job alerts
        timeout-minutes: 8
        run: python main.py run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit state
        timeout-minutes: 3
        run: |
          git config user.name  "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_jobs.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase origin main && git push)
